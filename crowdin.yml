project_id: '902373'
api_token_env: CROWDIN_PERSONAL_TOKEN
files:
  - source: /src/i18n/locales/en/ui.json
    translation: /src/i18n/locales/%two_letters_code%/ui.json
  - source: /src/i18n/locales/en/game.json
    translation: /src/i18n/locales/%two_letters_code%/game.json
  # Every system's SRD data tables + its own UI string bundle share the same
  # <name>.i18n.json / <name>.i18n.<lang>.json convention, so one wildcard
  # covers dnd5e2024, daggerheart, and any future src/systems/<id>/ folder —
  # no crowdin.yml edit needed to add a system.
  - source: /src/systems/*/i18n/*.i18n.json
    translation: /src/systems/**/i18n/%original_file_name%.%two_letters_code%.json
